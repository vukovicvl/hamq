name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.16.9"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"
      - name: ruff check
        run: ruff check hamq tests scripts
      - name: ruff format --check
        run: ruff format --check hamq tests scripts

  core-tests:
    name: Core tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    container:
      image: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: pytest tests/core (no QGIS)
        run: python -m pytest -p no:cacheprovider tests/core -q
      - name: Translation catalogs, strict (unused keys fail)
        env:
          HAMQ_STRICT_I18N: "1"
        run: python -m pytest -p no:cacheprovider tests/core/test_i18n_catalog.py -q

  qgis-tests:
    name: QGIS tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "target": a Docker target of scripts/test_qgis.sh (the same run as locally).
        # "image": a QGIS image that script has no target for yet; it is run the same
        # way (read-only checkout, own user, offscreen, no files written).
        include:
          - image: "qgis/qgis:3.34"
            name: QGIS 3.34 (minimum), Qt5, qgis/qgis:3.34
          - target: "3.44"
            name: QGIS 3.44, Qt5, qgis/qgis:3.44-trixie
          - target: "4.0"
            name: QGIS 4.0, Qt6, qgis/qgis:4.0-trixie
          - image: "qgis/qgis:4.2-trixie"
            name: QGIS 4.2, Qt6, qgis/qgis:4.2-trixie
    steps:
      - uses: actions/checkout@v7
      - name: Run tests/qgis in Docker (scripts/test_qgis.sh)
        if: matrix.target
        run: bash scripts/test_qgis.sh "${{ matrix.target }}" -ra
      - name: Run tests/qgis in Docker (${{ matrix.image }})
        if: matrix.image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e QT_QPA_PLATFORM=offscreen \
            -e XDG_RUNTIME_DIR=/tmp/xdg \
            -v "$PWD":/app:ro \
            -w /app \
            "$IMAGE" \
            sh -c 'mkdir -p /tmp/xdg && chmod 700 /tmp/xdg && exec python3 -m pytest -p no:cacheprovider tests/qgis -ra'

  package:
    name: Plugin zip
    runs-on: ubuntu-latest
    needs: [lint, core-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # A release zip is built with --release (CHANGELOG section, metadata changelog,
      # committed sources), see docs/RELEASING.md.
      - name: Build dist/hamq-<version>.zip
        run: python scripts/package.py --output-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: hamq-plugin-zip
          path: dist/*.zip
          if-no-files-found: error
