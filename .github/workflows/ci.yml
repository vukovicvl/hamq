name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.16.9"
  # The scan tools of plugins.qgis.org, pinned like the site
  # (qgis/QGIS-Plugins-Website, dockerize/docker/REQUIREMENTS.txt, 2026-10-02).
  BANDIT_VERSION: "~=1.9"
  DETECT_SECRETS_VERSION: "~=1.5"
  FLAKE8_VERSION: "~=7.3"
  FLAKE8_JSON_VERSION: "~=24.4"
  # The site's Qt6 check runs pyqt5_to_pyqt6.py from this image (it follows the tag).
  QT6_CHECKER_IMAGE: "ghcr.io/qgis/pyqgis4-checker:main-ubuntu"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"
      - name: ruff check
        run: ruff check hamq tests scripts
      - name: ruff format --check
        run: ruff format --check hamq tests scripts

  core-tests:
    name: Core tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    container:
      image: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: pytest tests/core (no QGIS)
        run: python -m pytest -p no:cacheprovider tests/core -q
      - name: Translation catalogs, strict (unused keys fail)
        env:
          HAMQ_STRICT_I18N: "1"
        run: python -m pytest -p no:cacheprovider tests/core/test_i18n_catalog.py -q

  qgis-tests:
    name: QGIS tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "target": a Docker target of scripts/test_qgis.sh (the same run as locally).
        # "image": a QGIS image that script has no target for yet; it is run the same
        # way (read-only checkout, own user, offscreen, no files written).
        include:
          - image: "qgis/qgis:3.34"
            name: QGIS 3.34 (minimum), Qt5, qgis/qgis:3.34
          - target: "3.44"
            name: QGIS 3.44, Qt5, qgis/qgis:3.44-trixie
          - target: "4.0"
            name: QGIS 4.0, Qt6, qgis/qgis:4.0-trixie
          - image: "qgis/qgis:4.2-trixie"
            name: QGIS 4.2, Qt6, qgis/qgis:4.2-trixie
    steps:
      - uses: actions/checkout@v7
      - name: Run tests/qgis in Docker (scripts/test_qgis.sh)
        if: matrix.target
        run: bash scripts/test_qgis.sh "${{ matrix.target }}" -ra
      - name: Run tests/qgis in Docker (${{ matrix.image }})
        if: matrix.image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e QT_QPA_PLATFORM=offscreen \
            -e XDG_RUNTIME_DIR=/tmp/xdg \
            -v "$PWD":/app:ro \
            -w /app \
            "$IMAGE" \
            sh -c 'mkdir -p /tmp/xdg && chmod 700 /tmp/xdg && exec python3 -m pytest -p no:cacheprovider tests/qgis -ra'

  package:
    name: Plugin zip
    runs-on: ubuntu-latest
    needs: [lint, core-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # A release zip is built with --release (CHANGELOG section, metadata changelog,
      # committed sources), see docs/RELEASING.md.
      - name: Build dist/hamq-<version>.zip
        run: python scripts/package.py --output-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: hamq-plugin-zip
          path: dist/*.zip
          if-no-files-found: error

  qgis-repo-scan:
    name: plugins.qgis.org scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the site's scan tools
        run: |
          python -m pip install --disable-pip-version-check \
            "bandit${BANDIT_VERSION}" "detect-secrets${DETECT_SECRETS_VERSION}" \
            "flake8${FLAKE8_VERSION}" "flake8-json${FLAKE8_JSON_VERSION}"
      - name: Build the plugin zip
        run: python scripts/package.py --output-dir "$RUNNER_TEMP/dist"
      # Any finding fails, as on the site: Bandit (its 74 rules), detect-secrets,
      # Flake8 (its codes, plus E203 and E501) and the file checks.
      - name: Bandit, detect-secrets, Flake8, file checks (scripts/qgis_repo_scan.py)
        run: python scripts/qgis_repo_scan.py --zip "$RUNNER_TEMP"/dist/hamq-*.zip
      # The site's Qt6 check passes when pyqt5_to_pyqt6.py --dry_run exits 0; it exits 0
      # even when it proposes changes ("path:line:col - ..."), so HamQ fails on those too.
      - name: Qt6 check (pyqt5_to_pyqt6.py --dry_run)
        run: |
          zip_name="$(basename "$RUNNER_TEMP"/dist/hamq-*.zip)"
          status=0
          docker run --rm -v "$RUNNER_TEMP/dist":/dist:ro --entrypoint sh "$QT6_CHECKER_IMAGE" \
            -c 'mkdir /tmp/x && cd /tmp/x &&
              python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(\".\")" "/dist/$1" &&
              exec /usr/local/bin/pyqt5_to_pyqt6.py /tmp/x --dry_run' sh "$zip_name" \
            > "$RUNNER_TEMP/qt6.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/qt6.log"
          if [ "$status" -ne 0 ]; then echo "::error::pyqt5_to_pyqt6.py exited with $status"; exit 1; fi
          if grep -q '^/tmp/x/' "$RUNNER_TEMP/qt6.log"; then
            echo "::error::pyqt5_to_pyqt6.py proposes changes (see above)"; exit 1
          fi
